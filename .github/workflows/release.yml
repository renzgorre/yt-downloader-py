name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller Pillow

      - name: Generate assets (icon + installer banner)
        run: python generate_assets.py

      - name: Build exe (PyInstaller)
        run: |
          pyinstaller --onefile --windowed `
            --name "YT Downloader" `
            --icon "assets\icon.ico" `
            --collect-all customtkinter `
            --collect-all yt_dlp `
            --hidden-import PIL._tkinter_finder `
            main.py

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer (NSIS)
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $nsis installer.nsi

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Portable
          path: "dist/YT Downloader.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Setup
          path: "YT-Downloader-Setup.exe"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: YT Downloader ${{ github.ref_name }}
          body: |
            ## YT Downloader ${{ github.ref_name }}

            ### Download

            | File | Description |
            |------|-------------|
            | **YT-Downloader-Setup.exe** | Recommended — installs to Program Files, adds Start Menu & Desktop shortcuts, includes uninstaller |
            | **YT Downloader.exe** | Portable — single file, run from anywhere, no installation |

            ### First-time setup (inside the app)
            1. Click **Install ffmpeg** — needed for HD video merging and audio conversion
            2. Click **Install aria2c** — enables faster parallel downloads

            ### Uninstalling
            Use **Add or Remove Programs** in Windows Settings, or run the uninstaller from the Start Menu.
          files: |
            YT-Downloader-Setup.exe
            dist/YT Downloader.exe
