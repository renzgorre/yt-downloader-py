name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed `
            --name "YT Downloader" `
            --collect-all customtkinter `
            --collect-all yt_dlp `
            --hidden-import PIL._tkinter_finder `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Windows
          path: "dist/YT Downloader.exe"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: YT Downloader ${{ github.ref_name }}
          body: |
            ## YT Downloader ${{ github.ref_name }}

            ### Download
            👉 **[YT Downloader.exe](../../releases/download/${{ github.ref_name }}/YT.Downloader.exe)** — single file, no installation needed. Just download and run.

            ### First-time setup (inside the app)
            1. Click **Install ffmpeg** — needed for HD video merging and audio conversion
            2. Click **Install aria2c** — enables faster parallel downloads
          files: "dist/YT Downloader.exe"
